services:
  # ── DynamoDB Local (replaces PostgreSQL for local dev) ─────────────────────
  # The official Amazon DynamoDB Local Docker image emulates the full
  # DynamoDB API. No AWS account or credentials required for local dev.
  dynamodb-local:
    image: amazon/dynamodb-local:2.3.0
    container_name: drishti-dynamodb-local
    command: ["-jar", "DynamoDBLocal.jar", "-sharedDb", "-port", "8000"]
    ports:
      - "8000:8000"
    volumes:
      - dynamodb_data:/home/dynamodblocal/data

  # ── DynamoDB Table Initializer ─────────────────────────────────────────────
  # Runs once on startup to create the DrishtiKon-Main table with all
  # required GSIs and TTL settings (mirrors the SAM template.yaml).
  dynamodb-init:
    image: amazon/aws-cli:2.15.30
    container_name: drishti-dynamodb-init
    depends_on:
      - dynamodb-local
    environment:
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
      AWS_DEFAULT_REGION: ap-south-1
    entrypoint: >
      /bin/sh -c "
        sleep 2 &&
        aws dynamodb create-table
          --table-name DrishtiKon-Main
          --attribute-definitions
            AttributeName=PK,AttributeType=S
            AttributeName=SK,AttributeType=S
            AttributeName=GSI1PK,AttributeType=S
            AttributeName=GSI1SK,AttributeType=S
            AttributeName=GSI2PK,AttributeType=S
            AttributeName=GSI2SK,AttributeType=S
          --key-schema
            AttributeName=PK,KeyType=HASH
            AttributeName=SK,KeyType=RANGE
          --global-secondary-indexes
            '[{\"IndexName\":\"GSI1\",\"KeySchema\":[{\"AttributeName\":\"GSI1PK\",\"KeyType\":\"HASH\"},{\"AttributeName\":\"GSI1SK\",\"KeyType\":\"RANGE\"}],\"Projection\":{\"ProjectionType\":\"ALL\"}},{\"IndexName\":\"GSI2\",\"KeySchema\":[{\"AttributeName\":\"GSI2PK\",\"KeyType\":\"HASH\"},{\"AttributeName\":\"GSI2SK\",\"KeyType\":\"RANGE\"}],\"Projection\":{\"ProjectionType\":\"ALL\"}}]'
          --billing-mode PAY_PER_REQUEST
          --endpoint-url http://dynamodb-local:8000 2>&1 || echo 'Table already exists'
      "

  # ── Spring Boot API ────────────────────────────────────────────────────────
  api:
    build: ./apps/api
    container_name: drishti-api
    environment:
      SPRING_PROFILES_ACTIVE: local
      DYNAMODB_ENDPOINT: http://dynamodb-local:8000
      DYNAMODB_TABLE_NAME: DrishtiKon-Main
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
      AWS_REGION: ap-south-1
      JWT_SECRET: ${JWT_SECRET:-TmV2ZXJVc2VUaGlzSW5Qcm9kR2VuZXJhdGVBUmVhbDI1NkJpdEtleQ==}
      SES_SMTP_HOST: ${SES_SMTP_HOST:-email-smtp.eu-north-1.amazonaws.com}
      SES_SMTP_PORT: ${SES_SMTP_PORT:-465}
      SES_SMTP_USERNAME: ${SES_SMTP_USERNAME}
      SES_SMTP_PASSWORD: ${SES_SMTP_PASSWORD}
      MAIL_FROM_EMAIL: ${MAIL_FROM_EMAIL:-noreply@aitpune.edu.in}
      FRONTEND_URL: http://localhost:3000
    ports:
      - "8080:8080"
    depends_on:
      - dynamodb-init

  # ── Next.js Frontend ───────────────────────────────────────────────────────
  web:
    build:
      context: ./apps/web
      target: dev
    container_name: drishti-web
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8080/api
    ports:
      - "3000:3000"
    depends_on:
      - api
    volumes:
      - ./apps/web/src:/app/src

volumes:
  dynamodb_data:
