name: Deploy Backend to AWS Lambda

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy-api:
    name: Build JAR & Deploy via SAM
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout ────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Java 21 (matches Lambda runtime) ───────────────────────────────
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "corretto"   # same distro as AWS Lambda

      # ── 3. Cache Maven dependencies ────────────────────────────────────────
      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('apps/api/pom.xml') }}
          restore-keys: ${{ runner.os }}-maven-

      # ── 4. Configure AWS credentials ───────────────────────────────────────
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      # ── 6. Install AWS SAM CLI ─────────────────────────────────────────────
      - name: Install AWS SAM CLI
        uses: aws-actions/setup-sam@v2
        with:
          use-installer: true

      # ── 7. SAM build (validates template + resolves dependencies) ──────────
      - name: SAM build
        run: sam build --template template.yaml

      # ── 8. SAM deploy (no-confirm, secrets come from GitHub Secrets) ───────
      - name: SAM deploy
        run: |
          sam deploy \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --stack-name drishti-kon \
            --region ap-south-1 \
            --capabilities CAPABILITY_IAM \
            --resolve-s3 \
            --s3-prefix drishti-kon \
            --parameter-overrides \
              JwtSecret="${{ secrets.JWT_SECRET }}" \
              FrontendUrl="${{ secrets.FRONTEND_URL }}"
