name = "drishtikon"
compatibility_date = "2026-08-28"

# Serve the Next.js static export as a static site on Cloudflare Workers.
# `not_found_handling = "single-page-application"` replaces the _redirects SPA
# fallback — unknown paths are served index.html so client-side routing works.
[assets]
directory = "apps/web/out"
not_found_handling = "single-page-application"
