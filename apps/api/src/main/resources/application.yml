server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: drishti-kon-api
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  # JPA / DataSource / Flyway REMOVED.
  # All data access is via software.amazon.awssdk:dynamodb-enhanced.

  # Email sending disabled — OTP stored in DynamoDB only

aws:
  region: ${AWS_REGION:ap-south-1}

dynamodb:
  endpoint: ${DYNAMODB_ENDPOINT:}
  table-name: ${DYNAMODB_TABLE_NAME:DrishtiKon-Main}

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: 2592000000 # 30 days
  otp:
    expiry-minutes: 5
    max-attempts: 5
  auth:
    allowed-domain: aitpune.edu.in
    frontend-url: ${FRONTEND_URL:http://localhost:3000}
    additional-origins: ${ADDITIONAL_ORIGINS:}

logging:
  level:
    com.drishti.kon: INFO
